<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Absensi Smartcard</title>
  <!-- Pustaka Pembaca QR Code -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 500px;
      text-align: center;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 20px;
    }
    button {
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      background-color: #007bff;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background-color: #0056b3; }
    button.active { background-color: #28a745; }
    .mode-section {
      border: 1px solid #e0e0e0;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      width: 90%;
      padding: 10px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      text-align: center;
    }
    #statusBox {
      padding: 15px;
      border-radius: 8px;
      display: none;
      margin-top: 15px;
    }
    .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    #fotoSiswa {
      width: 130px;
      height: 160px;
      object-fit: cover;
      border-radius: 6px;
      margin: 10px auto 0 auto;
      display: block;
      border: 2px solid #28a745;
    }
    #reader { width: 100%; margin-top: 10px; }
  </style>
</head>
<body>

<div class="card">
  <h2>Sistem Absensi</h2>
  <p>Pilih metode absensi:</p>

  <div class="btn-group">
    <button id="btnRfid" class="active" onclick="switchMode('rfid')">💳 RFID / Barcode</button>
    <button id="btnQr" onclick="switchMode('qr')">📷 QR Code</button>
    <button id="btnNfc" onclick="switchMode('nfc')">📱 NFC (HP)</button>
  </div>

  <!-- MODE RFID -->
  <div id="modeRfid" class="mode-section">
    <h4>Tempelkan Kartu RFID</h4>
    <p style="font-size: 12px; color: #666;">Pastikan kursor ada di dalam kotak input ini saat menempelkan kartu.</p>
    <input type="text" id="rfidInput" placeholder="Tap kartu di sini..." autofocus onchange="prosesAbsen(this.value)">
  </div>

  <!-- MODE QR CODE -->
  <div id="modeQr" class="mode-section" style="display: none;">
    <h4>Scan QR Code</h4>
    <div id="reader"></div>
  </div>

  <!-- MODE NFC (HP) -->
  <div id="modeNfc" class="mode-section" style="display: none;">
    <h4>Scan NFC Smartphone</h4>
    <p style="font-size: 12px; color: #666;">Tekan tombol lalu tempelkan kartu NFC/KTM ke belakang HP (Chrome Android).</p>
    <button style="background-color: #28a745;" onclick="mulaiScanNFC()">Mulai Scan NFC</button>
  </div>

  <!-- KOTAK NOTIFIKASI & FOTO -->
  <div id="statusBox">
    <div id="statusText"></div>
    <img id="fotoSiswa" src="" alt="Foto Siswa" style="display:none;">
  </div>
</div>

<script>
  // ⚠️ GANTI DENGAN URL WEB APP APPS SCRIPT ANDA
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycb.../exec"; 

  let html5QrCode = null;

  // 1. Fungsi Konversi URL Google Drive ke Direct Link Gambar
  function formatDriveUrl(url) {
    if (!url) return "";
    var fileIdMatch = url.toString().match(/[-\w]{25,}/);
    if (fileIdMatch) {
      return "https://lh3.googleusercontent.com/d/" + fileIdMatch[0];
    }
    return url;
  }

  // 2. Peranti Mode Absensi (RFID / QR / NFC)
  function switchMode(mode) {
    document.getElementById('modeRfid').style.display = 'none';
    document.getElementById('modeQr').style.display = 'none';
    document.getElementById('modeNfc').style.display = 'none';

    document.getElementById('btnRfid').classList.remove('active');
    document.getElementById('btnQr').classList.remove('active');
    document.getElementById('btnNfc').classList.remove('active');

    // Hentikan kamera QR jika beralih mode
    if (html5QrCode && html5QrCode.isScanning) {
      html5QrCode.stop().catch(err => console.log(err));
    }

    if (mode === 'rfid') {
      document.getElementById('modeRfid').style.display = 'block';
      document.getElementById('btnRfid').classList.add('active');
      document.getElementById('rfidInput').focus();
    } else if (mode === 'qr') {
      document.getElementById('modeQr').style.display = 'block';
      document.getElementById('btnQr').classList.add('active');
      startQrCamera();
    } else if (mode === 'nfc') {
      document.getElementById('modeNfc').style.display = 'block';
      document.getElementById('btnNfc').classList.add('active');
    }
  }

  // 3. Menjalankan Kamera QR Code Otomatis (Tanpa Tombol Permission)
  function startQrCamera() {
    html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 200, height: 200 } },
      (decodedText) => {
        prosesAbsen(decodedText);
      },
      (errorMessage) => {}
    ).catch(err => {
      alert("Gagal membuka kamera. Pastikan izin kamera aktif di browser.");
    });
  }

  // 4. Menjalankan Web NFC API (Khusus HP Android)
  async function mulaiScanNFC() {
    if ('NDEFReader' in window) {
      try {
        const ndef = new NDEFReader();
        await ndef.scan();
        alert("Sensor NFC Aktif! Tempelkan kartu ke belakang HP.");
        
        ndef.addEventListener("reading", ({ serialNumber }) => {
          prosesAbsen(serialNumber);
        });
      } catch (error) {
        alert("Error NFC: " + error.message);
      }
    } else {
      alert("Maaf, browser atau perangkat ini tidak mendukung Web NFC API. Gunakan Chrome di Android.");
    }
  }

  // 5. Mengirim Data ke Google Apps Script
  function prosesAbsen(rfidCode) {
    if (!rfidCode) return;

    var statusBox = document.getElementById("statusBox");
    var statusText = document.getElementById("statusText");
    var fotoElement = document.getElementById("fotoSiswa");

    statusBox.style.display = "block";
    statusBox.className = "card";
    statusText.innerHTML = "⌛ Memproses absensi...";
    fotoElement.style.display = "none";

    fetch(SCRIPT_URL + "?action=getStudent&rfid=" + encodeURIComponent(rfidCode))
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          statusBox.className = "success";
          statusText.innerHTML = "<b>✅ Berhasil: " + data.nama + "</b> (via " + data.kelas + ") pada " + data.waktu;
          
          if (data.foto) {
            fotoElement.src = formatDriveUrl(data.foto);
            fotoElement.style.display = "block";
          }
        } else {
          statusBox.className = "error";
          statusText.innerHTML = "<b>❌ Gagal:</b> " + data.message;
        }
        document.getElementById("rfidInput").value = "";
      })
      .catch(err => {
        statusBox.className = "error";
        statusText.innerHTML = "<b>❌ Error Koneksi Server.</b>";
        document.getElementById("rfidInput").value = "";
      });
  }
</script>
</body>
</html>
